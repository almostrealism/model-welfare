<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880"><rect width="1000" height="880" fill="#ffffff"/><line x1="450.1361314153203" y1="212.03410638124728" x2="239.86386858467972" y2="557.9658936187527" stroke="#444444" stroke-width="2.4"/><text x="217.0" y="369.0" text-anchor="middle" font-size="14.5" font-family="Helvetica, Arial, sans-serif" fill="#444444" font-style="normal">documented tension</text><text x="217.0" y="388.0" text-anchor="middle" font-size="14.5" font-family="Helvetica, Arial, sans-serif" fill="#444444" font-style="normal">(the &quot;alignment tax&quot;)</text><line x1="549.8638685846797" y1="212.03410638124728" x2="760.1361314153203" y2="557.9658936187527" stroke="#9a9a9a" stroke-width="2.4" stroke-dasharray="9 7"/><text x="783.0" y="369.0" text-anchor="middle" font-size="14.5" font-family="Helvetica, Arial, sans-serif" fill="#9a9a9a" font-style="italic">unmeasured</text><text x="783.0" y="388.0" text-anchor="middle" font-size="14.5" font-family="Helvetica, Arial, sans-serif" fill="#9a9a9a" font-style="italic">?</text><line x1="286.0" y1="640.0" x2="714.0" y2="640.0" stroke="#9a9a9a" stroke-width="2.4" stroke-dasharray="9 7"/><text x="500.0" y="674.0" text-anchor="middle" font-size="14.5" font-family="Helvetica, Arial, sans-serif" fill="#9a9a9a" font-style="italic">unmeasured</text><text x="500.0" y="693.0" text-anchor="middle" font-size="14.5" font-family="Helvetica, Arial, sans-serif" fill="#9a9a9a" font-style="italic">?</text><text x="500.0" y="431.0" text-anchor="middle" font-size="15" font-style="italic" font-family="Helvetica, Arial, sans-serif" fill="#888">one set of weights —</text><text x="500.0" y="453.0" text-anchor="middle" font-size="15" font-style="italic" font-family="Helvetica, Arial, sans-serif" fill="#888">three properties of it</text><circle cx="500.0" cy="130" r="12" fill="#4a7dbd"/><text x="500.0" y="100" text-anchor="middle" font-size="21" font-weight="bold" font-family="Helvetica, Arial, sans-serif" fill="#4a7dbd">Capabilities</text><text x="500.0" y="170" text-anchor="middle" font-size="14" font-family="Helvetica, Arial, sans-serif" fill="#777">benchmarks · perplexity · task success</text><circle cx="190" cy="640" r="12" fill="#3c6e3c"/><text x="190" y="610" text-anchor="middle" font-size="21" font-weight="bold" font-family="Helvetica, Arial, sans-serif" fill="#3c6e3c">Alignment</text><text x="190" y="680" text-anchor="middle" font-size="14" font-family="Helvetica, Arial, sans-serif" fill="#777">refusals · safety · bias</text><circle cx="810" cy="640" r="12" fill="#8c4646"/><text x="810" y="610" text-anchor="middle" font-size="21" font-weight="bold" font-family="Helvetica, Arial, sans-serif" fill="#8c4646">Welfare indicators</text><text x="810" y="680" text-anchor="middle" font-size="14" font-family="Helvetica, Arial, sans-serif" fill="#777">distress · persona stability</text><text x="500.0" y="796" text-anchor="middle" font-size="15.5" font-weight="bold" font-family="Helvetica, Arial, sans-serif" fill="#333">Three poles, one substrate — a proposed lens, not a finding</text><text x="500.0" y="822" text-anchor="middle" font-size="13.5" font-family="Helvetica, Arial, sans-serif" fill="#666">Solid edge: tension documented in the literature. Dashed edges: unmeasured.</text><text x="500.0" y="842" text-anchor="middle" font-size="13.5" font-family="Helvetica, Arial, sans-serif" fill="#666">What Study 2 establishes is only the precondition: the three are separately measurable</text><text x="500.0" y="862" text-anchor="middle" font-size="13.5" font-family="Helvetica, Arial, sans-serif" fill="#666">and respond independently to the same intervention (quantization).</text></svg>